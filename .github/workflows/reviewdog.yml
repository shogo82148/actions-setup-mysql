name: reviewdog
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: reviewdog/action-actionlint@v1.77.0

  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      - uses: reviewdog/action-eslint@v1.36.0
        with:
          reporter: github-pr-review
          level: warning
          eslint_flags: "."
